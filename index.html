<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─────────────────── helpers ─────────────────── */
const stripPunct = s => s.toLowerCase().replace(/[^a-z0-9']/gi,'').trim();

const levenshtein = (a,b) => {
  if(a===b) return 0; if(!a.length) return b.length; if(!b.length) return a.length;
  const dp = Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);
  }
  return dp[a.length][b.length];
};

const wordsMatch = (heard,target) => {
  const h=stripPunct(heard), t=stripPunct(target);
  if(!h||!t) return false;
  if(h===t||h.includes(t)||t.includes(h)) return true;
  if(t.length<=2) return h===t;
  return levenshtein(h,t)<=1;
};

const tokenize = line => line.split(/\s+/).filter(Boolean);

const isNewStory = dateAdded => {
  if(!dateAdded) return false;
  const d=new Date(dateAdded); if(isNaN(d.getTime())) return false;
  return (Date.now()-d.getTime())/(86400000) <= 7;
};

const getImageUrl = prompt => `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=400&nologo=true&seed=42`;

const fmtTime = ts => {
  const d=new Date(ts), now=new Date();
  const diff=Math.round((now-d)/60000);
  if(diff<1) return 'just now';
  if(diff<60) return `${diff}m ago`;
  const h=Math.round(diff/60);
  if(h<24) return `${h}h ago`;
  return `${Math.round(h/24)}d ago`;
};

const LEVEL_META = {
  foundation:{ key:'foundation', label:'Foundation', emoji:'🌱', klass:'foundation' },
  year1:     { key:'year1',      label:'Year 1',     emoji:'⭐', klass:'year1' },
  year2:     { key:'year2',      label:'Year 2',     emoji:'🚀', klass:'year2' },
  year3:     { key:'year3',      label:'Year 3',     emoji:'🏆', klass:'year3' },
};

const SpeechRecognition = typeof window!=='undefined'
  ? (window.SpeechRecognition||window.webkitSpeechRecognition) : null;

/* ─────────────────── Avatar SVG ─────────────────── */
const SKIN_TONES  = ['#FDDBB4','#F0C27F','#D4956A','#A0522D','#5C3317'];
const HAIR_COLS   = ['#2C1810','#8B4513','#F4C842','#D44E2E','#AAAAAA','#FF69B4','#4B0082'];
const SHIRT_COLS  = ['#E8523A','#1A7A6E','#F5C518','#6C63FF','#FF9800','#E91E63','#2196F3','#4CAF50'];
const PANTS_COLS  = ['#3a2e1f','#1565C0','#37474F','#6A1B9A','#BF360C','#F9A825'];
const SHOE_COLS   = ['#3a2e1f','#E8523A','#1A7A6E','#F5C518','#FFFFFF'];
const HAIR_STYLES = ['short','long','curly','bun','none'];
const ACCESSORIES = ['none','hat','crown','bow','glasses'];

const AvatarSVG = ({ skin, hair, hairStyle, shirt, pants, shoes, accessory, size=160 }) => {
  const s = size;
  const hs = hairStyle || 'short';
  const acc = accessory || 'none';

  const hairPaths = {
    short: <rect x={s*.28} y={s*.08} width={s*.44} height={s*.16} rx={s*.05} fill={hair}/>,
    long:  <><rect x={s*.28} y={s*.08} width={s*.44} height={s*.16} rx={s*.05} fill={hair}/><rect x={s*.24} y={s*.17} width={s*.08} height={s*.22} rx={s*.04} fill={hair}/><rect x={s*.68} y={s*.17} width={s*.08} height={s*.22} rx={s*.04} fill={hair}/></>,
    curly: <><ellipse cx={s*.5} cy={s*.14} rx={s*.23} ry={s*.1} fill={hair}/><ellipse cx={s*.29} cy={s*.19} rx={s*.07} ry={s*.07} fill={hair}/><ellipse cx={s*.71} cy={s*.19} rx={s*.07} ry={s*.07} fill={hair}/></>,
    bun:   <><rect x={s*.3} y={s*.1} width={s*.4} height={s*.12} rx={s*.04} fill={hair}/><circle cx={s*.5} cy={s*.08} r={s*.08} fill={hair}/></>,
    none:  null,
  };

  const accPath = {
    none:    null,
    hat:     <><rect x={s*.22} y={s*.08} width={s*.56} height={s*.06} rx={s*.02} fill="#5C3317"/><rect x={s*.3} y={s*.02} width={s*.4} height={s*.1} rx={s*.04} fill="#5C3317"/></>,
    crown:   <polygon points={`${s*.3},${s*.1} ${s*.38},${s*.02} ${s*.5},${s*.08} ${s*.62},${s*.02} ${s*.7},${s*.1}`} fill="#F5C518" stroke="#c79c0c" strokeWidth="1.5"/>,
    bow:     <><ellipse cx={s*.38} cy={s*.07} rx={s*.07} ry={s*.04} fill="#E8523A"/><ellipse cx={s*.62} cy={s*.07} rx={s*.07} ry={s*.04} fill="#E8523A"/><circle cx={s*.5} cy={s*.07} r={s*.025} fill="#c0392b"/></>,
    glasses: <><rect x={s*.3} y={s*.28} width={s*.14} height={s*.09} rx={s*.03} fill="none" stroke="#3a2e1f" strokeWidth="2"/><rect x={s*.56} y={s*.28} width={s*.14} height={s*.09} rx={s*.03} fill="none" stroke="#3a2e1f" strokeWidth="2"/><line x1={s*.44} y1={s*.325} x2={s*.56} y2={s*.325} stroke="#3a2e1f" strokeWidth="1.5"/></>,
  };

  return (
    <svg viewBox={`0 0 ${s} ${s}`} width={s} height={s} xmlns="http://www.w3.org/2000/svg">
      {/* Body */}
      <rect x={s*.3} y={s*.48} width={s*.4} height={s*.28} rx={s*.05} fill={shirt}/>
      {/* Arms */}
      <rect x={s*.15} y={s*.5} width={s*.15} height={s*.22} rx={s*.05} fill={shirt}/>
      <rect x={s*.7}  y={s*.5} width={s*.15} height={s*.22} rx={s*.05} fill={shirt}/>
      {/* Hands */}
      <circle cx={s*.22} cy={s*.73} r={s*.06} fill={skin}/>
      <circle cx={s*.78} cy={s*.73} r={s*.06} fill={skin}/>
      {/* Pants */}
      <rect x={s*.3}  y={s*.74} width={s*.18} height={s*.18} rx={s*.04} fill={pants}/>
      <rect x={s*.52} y={s*.74} width={s*.18} height={s*.18} rx={s*.04} fill={pants}/>
      {/* Shoes */}
      <ellipse cx={s*.39} cy={s*.93} rx={s*.11} ry={s*.05} fill={shoes}/>
      <ellipse cx={s*.61} cy={s*.93} rx={s*.11} ry={s*.05} fill={shoes}/>
      {/* Neck */}
      <rect x={s*.44} y={s*.38} width={s*.12} height={s*.12} rx={s*.03} fill={skin}/>
      {/* Head */}
      <ellipse cx={s*.5} cy={s*.26} rx={s*.22} ry={s*.2} fill={skin}/>
      {/* Hair base (back) */}
      {hs!=='none'&&<ellipse cx={s*.5} cy={s*.2} rx={s*.22} ry={s*.12} fill={hair}/>}
      {/* Eyes */}
      <circle cx={s*.42} cy={s*.25} r={s*.03} fill="#2C1810"/>
      <circle cx={s*.58} cy={s*.25} r={s*.03} fill="#2C1810"/>
      <circle cx={s*.425} cy={s*.24} r={s*.01} fill="#fff"/>
      <circle cx={s*.585} cy={s*.24} r={s*.01} fill="#fff"/>
      {/* Smile */}
      <path d={`M${s*.43},${s*.31} Q${s*.5},${s*.36} ${s*.57},${s*.31}`} fill="none" stroke="#8B4040" strokeWidth="1.8" strokeLinecap="round"/>
      {/* Hair details */}
      {hairPaths[hs]}
      {/* Accessory on top */}
      {accPath[acc]}
    </svg>
  );
};

/* ─────────────────── Confetti ─────────────────── */
const Burst = ({ onDone }) => {
  useEffect(()=>{ const t=setTimeout(onDone,1200); return()=>clearTimeout(t); },[]);
  const stars=['⭐','🌟','✨','💫','🎉'];
  return (
    <div className="burst-wrap">
      {Array.from({length:18},(_,i)=>{
        const angle=(Math.PI*2*i)/18+Math.random()*.3;
        const d=170+Math.random()*110;
        return <div key={i} className="burst-star"
          style={{left:'50%',top:'50%','--et':`translate(${Math.cos(angle)*d}px,${Math.sin(angle)*d}px)`}}>
          {stars[i%stars.length]}
        </div>;
      })}
    </div>
  );
};

/* ─────────────────── Recent Readers Widget ─────────────────── */
const RecentReaders = () => {
  const [readers,setReaders]=useState([]);
  const [ready,setReady]=useState(false);

  useEffect(()=>{
    const connect = () => {
      if(!window.__fbReady||!window.__fbDb) return;
      setReady(true);
      try {
        const q = window.__fbQuery(
          window.__fbRef(window.__fbDb,'recentReaders'),
          window.__fbOrderByChild('timestamp'),
          window.__fbLimitToLast(10)
        );
        window.__fbOnValue(q, snap=>{
          const data=snap.val();
          if(!data) return;
          const list=Object.values(data)
            .sort((a,b)=>b.timestamp-a.timestamp)
            .slice(0,8);
          setReaders(list);
        });
      } catch(e){ /* Firebase not configured yet */ }
    };
    if(window.__fbReady) connect();
    else window.addEventListener('firebase-ready',connect);
    return()=>window.removeEventListener('firebase-ready',connect);
  },[]);

  if(!ready||readers.length===0) return null;

  return (
    <div className="recent-section">
      <div className="recent-title">📖 Recent Readers</div>
      {readers.map((r,i)=>(
        <div key={i} className="reader-chip">
          <div style={{flexShrink:0,width:36,height:36,overflow:'hidden',borderRadius:'50%',background:'#f5ead3',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {r.avatar ? <AvatarSVG {...r.avatar} size={36}/> : <span style={{fontSize:20}}>😊</span>}
          </div>
          <div className="rname">{r.name}</div>
          <div className="rinfo">{LEVEL_META[r.levelKey]?.emoji} {r.levelLabel} · {fmtTime(r.timestamp)}</div>
        </div>
      ))}
    </div>
  );
};

/* ─────────────────── Reading Screen ─────────────────── */
const ReadingScreen = ({ story, profile, onBack, onComplete }) => {
  const tokenLines=story.lines.map(tokenize);
  const totalWords=tokenLines.reduce((a,l)=>a+l.length,0);

  const [lineIndex,setLineIndex]=useState(0);
  const [wordIndex,setWordIndex]=useState(0);
  const [wordStates,setWordStates]=useState(()=>tokenLines.map(l=>l.map(()=>'pending')));
  const [isListening,setIsListening]=useState(false);
  const [imageState,setImageState]=useState('loading');
  const [nudge,setNudge]=useState('');
  const [showBurst,setShowBurst]=useState(false);
  const [srSupported]=useState(!!SpeechRecognition);

  const recRef=useRef(null);
  const manualStopRef=useRef(false);
  const stateRef=useRef({lineIndex:0,wordIndex:0,tokenLines,wordStates:null});
  stateRef.current.lineIndex=lineIndex;
  stateRef.current.wordIndex=wordIndex;
  stateRef.current.tokenLines=tokenLines;
  stateRef.current.wordStates=wordStates;
  const nudgeTimer=useRef(null);
  const advTimer=useRef(null);
  const advancing=useRef(false);

  const correctCount=wordStates.reduce((a,l)=>a+l.filter(w=>w==='correct').length,0);
  const completedWords=wordStates.reduce((a,l)=>a+l.filter(w=>w!=='pending').length,0);
  const pct=Math.round((completedWords/totalWords)*100);

  const scheduleNudge=useCallback(()=>{
    if(nudgeTimer.current) clearTimeout(nudgeTimer.current);
    nudgeTimer.current=setTimeout(()=>{
      setNudge('Try again! You can do it 💪');
      setTimeout(()=>setNudge(''),2000);
    },3000);
  },[]);

  const clearNudge=()=>{ if(nudgeTimer.current){clearTimeout(nudgeTimer.current);nudgeTimer.current=null;} };

  const markWord=(lIdx,wIdx,state)=>{
    setWordStates(prev=>{ const c=prev.map(l=>[...l]); if(c[lIdx]&&c[lIdx][wIdx]!==undefined) c[lIdx][wIdx]=state; return c; });
  };

  const advanceAfterLine=lIdx=>{
    if(advancing.current) return;
    advancing.current=true;
    setShowBurst(true);
    advTimer.current=setTimeout(()=>{
      advancing.current=false;
      if(lIdx+1>=tokenLines.length){
        const fc=stateRef.current.wordStates.reduce((a,l)=>a+l.filter(w=>w==='correct').length,0);
        stopListening();
        onComplete({correct:fc,total:totalWords});
      } else {
        setLineIndex(lIdx+1); setWordIndex(0); scheduleNudge();
      }
    },1500);
  };

  const handleTranscript=useCallback(transcript=>{
    if(advancing.current) return;
    const {lineIndex:li,wordIndex:wi,tokenLines:tL}=stateRef.current;
    const tokens=tL[li]; if(!tokens||wi>=tokens.length) return;
    const target=tokens[wi];
    const spoken=transcript.trim().split(/\s+/).filter(Boolean).slice(-4);
    let matched=false;
    for(let i=spoken.length-1;i>=0;i--) if(wordsMatch(spoken[i],target)){matched=true;break;}
    if(matched){
      clearNudge(); setNudge('');
      markWord(li,wi,'correct');
      const next=wi+1;
      if(next>=tokens.length) advanceAfterLine(li);
      else { setWordIndex(next); scheduleNudge(); }
    }
  },[scheduleNudge]);

  const startListening=()=>{
    if(!srSupported) return;
    if(recRef.current) try{recRef.current.stop();}catch(e){}
    const rec=new SpeechRecognition();
    rec.continuous=true; rec.interimResults=true; rec.lang='en-AU';
    rec.onresult=e=>{
      let fi='',ii='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fi+=' '+t; else ii+=' '+t;
      }
      const lat=(fi+' '+ii).trim(); if(lat) handleTranscript(lat);
    };
    rec.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        setIsListening(false); setNudge('Microphone permission needed 🎤');
        setTimeout(()=>setNudge(''),3000); manualStopRef.current=true;
      }
    };
    rec.onend=()=>{ if(!manualStopRef.current) try{rec.start();}catch(e){setTimeout(()=>{try{rec.start();}catch(e){}},250);} };
    manualStopRef.current=false; recRef.current=rec;
    try{ rec.start(); setIsListening(true); scheduleNudge(); }
    catch(e){ setIsListening(false); }
  };

  const stopListening=()=>{
    manualStopRef.current=true; clearNudge();
    if(recRef.current){ try{recRef.current.stop();}catch(e){} recRef.current=null; }
    setIsListening(false);
  };

  const skipWord=()=>{
    const {lineIndex:li,wordIndex:wi,tokenLines:tL}=stateRef.current;
    const tokens=tL[li]; if(!tokens||wi>=tokens.length) return;
    clearNudge(); markWord(li,wi,'skipped');
    const next=wi+1;
    if(next>=tokens.length) advanceAfterLine(li);
    else { setWordIndex(next); scheduleNudge(); }
  };

  useEffect(()=>()=>{
    manualStopRef.current=true;
    if(recRef.current) try{recRef.current.stop();}catch(e){}
    if(nudgeTimer.current) clearTimeout(nudgeTimer.current);
    if(advTimer.current) clearTimeout(advTimer.current);
  },[]);

  const curTokens=tokenLines[lineIndex]||[];
  const curStates=wordStates[lineIndex]||[];

  return (
    <div className="page">
      <div className="screen-header">
        <button className="btn btn-ghost btn-sm" onClick={()=>{stopListening();onBack();}}>← Stories</button>
        <MiniAvatar profile={profile} size={34}/>
      </div>

      <div className="progress-wrap">
        <div className="progress-fill" style={{width:`${pct}%`}}/>
      </div>

      <div className="story-img-wrap">
        <img src={getImageUrl(story.imagePrompt)}
          onLoad={()=>setImageState('loaded')} onError={()=>setImageState('error')}
          style={{display:imageState==='loaded'?'block':'none'}} alt={story.title}/>
        {imageState==='loading'&&<div className="img-placeholder">📖</div>}
        {imageState==='error'&&<div className="img-error">🌈</div>}
      </div>

      <h2 className="reading-title">{story.title}</h2>

      {!srSupported&&<div className="banner">Your browser doesn't support voice reading — try Chrome or Safari! Use the Skip button to keep going.</div>}

      <div className="line-box">
        {curTokens.map((tok,i)=>{
          const st=curStates[i]||'pending';
          let cls='word';
          if(st==='correct') cls+=' correct';
          else if(st==='incorrect') cls+=' incorrect';
          else if(st==='skipped') cls+=' skipped';
          else if(i===wordIndex) cls+=' active';
          return <span key={i} className={cls}>{tok}</span>;
        })}
      </div>

      <div className="nudge-text">{nudge}</div>

      <div className="controls">
        <button className="skip-btn" onClick={skipWord}>Skip Word</button>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
          <button className={`mic-btn${isListening?' listening':''}`} onClick={()=>isListening?stopListening():startListening()}
            disabled={!srSupported} aria-label={isListening?'Stop':'Start'}>
            {isListening?'🛑':'🎤'}
          </button>
          <div className="mic-label">{isListening?'Listening…':'Tap to read'}</div>
        </div>
        <div style={{width:70}}/>
      </div>

      {showBurst&&<Burst onDone={()=>setShowBurst(false)}/>}
    </div>
  );
};

  );
};

/* ─────────────────── App ─────────────────── */
const App = () => {
  const [stories,setStories]=useState(null);
  const [loadError,setLoadError]=useState(false);
  const [screen,setScreen]=useState('loading');
  // 'loading'|'profile'|'avatar-edit'|'level-select'|'story-select'|'reading'|'complete'
  const [profile,setProfile]=useState(()=>{
    try{ const s=localStorage.getItem('msb_profile'); return s?JSON.parse(s):null; }
    catch(e){ return null; }
  });
  const [selectedLevel,setSelectedLevel]=useState(null);
  const [selectedStory,setSelectedStory]=useState(null);
  const [finalScore,setFinalScore]=useState(null);
  const [readingKey,setReadingKey]=useState(0);

  const saveProfile = p => {
    setProfile(p);
    try{ localStorage.setItem('msb_profile',JSON.stringify(p)); }catch(e){}
  };

  const loadStories = useCallback(()=>{
    setLoadError(false); setScreen('loading');
    fetch('./stories.json',{cache:'no-store'})
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(data=>{
        setStories({
          foundation:data.foundation||[],
          year1:data.year1||[],
          year2:data.year2||[],
          year3:data.year3||[],
        });
        setScreen(profile?'level-select':'profile');
      })
      .catch(()=>setLoadError(true));
  },[profile]);

  useEffect(()=>{ loadStories(); },[]);

  if(loadError) return (
    <div className="page" style={{alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center',padding:'40px 24px'}}>
        <div style={{fontSize:'3.5rem',marginBottom:12}}>😕</div>
        <h2 style={{color:'#1A7A6E',marginBottom:10}}>Couldn't load stories</h2>
        <p style={{marginBottom:24,color:'#7a6549'}}>Check your connection and try again!</p>
        <button className="btn btn-primary" onClick={loadStories}>🔄 Retry</button>
      </div>
    </div>
  );

  if(screen==='loading'||!stories) return <Loader/>;

  if(screen==='profile') return (
    <ProfileSetup existing={profile} onDone={p=>{ saveProfile(p); setScreen('level-select'); }}/>
  );

  if(screen==='avatar-edit') return (
    <AvatarBuilderScreen
      initial={profile?.avatar}
      title="Edit Your Character"
      onSave={av=>{ saveProfile({...profile,avatar:av}); setScreen('level-select'); }}
    />
  );

  if(!profile) return <ProfileSetup onDone={p=>{ saveProfile(p); setScreen('level-select'); }}/>;

  if(screen==='level-select') return (
    <LevelSelect
      stories={stories} profile={profile}
      onPick={lvl=>{ setSelectedLevel(lvl); setScreen('story-select'); }}
      onEditProfile={()=>setScreen('avatar-edit')}
    />
  );

  if(screen==='story-select') return (
    <StorySelect
      levelKey={selectedLevel} stories={stories} profile={profile}
      onBack={()=>setScreen('level-select')}
      onPick={story=>{ setSelectedStory(story); setReadingKey(k=>k+1); setScreen('reading'); }}
    />
  );

  if(screen==='reading') return (
    <ReadingScreen
      key={readingKey} story={selectedStory} profile={profile}
      onBack={()=>setScreen('story-select')}
      onComplete={score=>{ setFinalScore(score); setScreen('complete'); }}
    />
  );

  if(screen==='complete') return (
    <CompleteScreen
      score={finalScore} profile={profile}
      levelKey={selectedLevel}
      levelLabel={LEVEL_META[selectedLevel]?.label||''}
      onReadAgain={()=>{ setReadingKey(k=>k+1); setScreen('reading'); }}
      onHome={()=>setScreen('story-select')}
    />
  );

  return <Loader/>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
